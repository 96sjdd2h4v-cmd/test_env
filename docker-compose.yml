services:

  haproxy:
    image: haproxy:alpine
    container_name: drupal_haproxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./docker/haproxy/blocked_ips.txt:/usr/local/etc/haproxy/blocked_ips.txt:ro
      - ./docker/nginx/certs/combined.pem:/etc/ssl/certs/combined.pem:ro
      - ./docker/haproxy/domains.map:/usr/local/etc/haproxy/domains.map:ro
    networks:
      - haproxy_net
    deploy:
      resources:
       reservations:
         cpus: '0.05'
         memory: 32M
       limits:
         cpus: '0.5'
         memory: 128M
    depends_on:
      - varnish-a
      - varnish-b
    restart: unless-stopped

  solr_init:
    image: busybox:latest
    container_name: central_solr_init
    user: root
    volumes:
      - solr_data:/var/solr/data:rw
    command: chown -R 8983:8983 /var/solr/data
      
    

  solr:
    image: solr:9.10.1
    container_name: central_solr
    restart: unless-stopped
    depends_on:
      solr_init:
        condition: service_completed_successfully
    volumes:
      - solr_data:/var/solr/data:rw
      - ./solr-ssl.keystore.p12:/var/solr/solr-ssl.keystore.p12:ro
      - ./conf_a:/var/solr/data/drupal_cluster_a/conf:rw
      - ./conf_b:/var/solr/data/drupal_cluster_b/conf:rw
      - ./conf_c:/var/solr/data/drupal_cluster_c/conf:rw
      - ./conf_d:/var/solr/data/drupal_cluster_d/conf:rw
    ports:
      - "8983:8983"
    environment:
      SOLR_SSL_ENABLED: "true"
      SOLR_MODULES: "analysis-extras"
      SOLR_OPTS: "-Dsolr.jetty.ssl.sniHostCheck=false"
      SOLR_SSL_KEY_STORE_TYPE: "PKCS12"
      SOLR_SSL_TRUST_STORE_TYPE: "PKCS12"
      SOLR_SSL_KEY_STORE: "/var/solr/solr-ssl.keystore.p12"
      SOLR_SSL_TRUST_STORE: "/var/solr/solr-ssl.keystore.p12"
      SOLR_SSL_KEY_STORE_PASSWORD: "${SOLR_SSL_PASSWORD}"
      SOLR_SSL_TRUST_STORE_PASSWORD: "${SOLR_SSL_PASSWORD}"
      SOLR_SSL_NEED_CLIENT_AUTH: "false"
      SOLR_SSL_WANT_CLIENT_AUTH: "false"
      SOLR_SSL_CHECK_PEER_NAME: "false"
    networks:
      - cluster_a_net
      - cluster_b_net
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 512M
        limits:
          cpus: '1.5'
          memory: 1024M
    entrypoint:
      - bash
      - "-c"
      - "solr-precreate drupal_cluster_a; solr-precreate drupal_cluster_b; exec solr -f"


  #CLUSTER A
  postgres-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drupal_test}
      POSTGRES_USER: ${POSTGRES_USER:-drupal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ./custom-postgres.conf:/etc/postgresql/postgresql.conf:ro
      - db_data_a:/var/lib/postgresql/data #bind 
      - ./docker/postgres/init-a.sql:/docker-entrypoint-initdb.d/init-a.sql:ro
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 256M
        limits:
          cpus: '1.50'
          memory: 640M
    networks:
      cluster_a_net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drupal_user} -d ${POSTGRES_DB:-drupal_test}"] #pg_isready is het door postgres geleverde commando voor checken of het ready is
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-a:
    image: redis:alpine
    container_name: drupaldocker-redis-1-a
    volumes:
      - redis_data_a:/data:rw
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      cluster_a_net:
        aliases:
          - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5 
    restart: unless-stopped

  php-init-a:
    build:
      context: .
      dockerfile: dockerfile
      target: app
    container_name: drupal-init-a
    working_dir: /var/www/html
    restart: "no"
    volumes:
      - ./:/var/www/html:rw #bind
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
      - drupal_public_files:/var/www/html/web/sites/default/files:rw
      - drupal_multisite_a_files:/var/www/html/web/sites/multisite-a.local/files:rw
      - drupal_multisite_b_files:/var/www/html/web/sites/multisite-b.local/files:rw
    networks:
      - cluster_a_net
      - haproxy_net
    depends_on:
      postgres-a:
        condition: service_healthy
      redis-a:
        condition: service_healthy
    command: ["sh", "-ec", "chown -R 82:82 /var/www/html/web/sites/default/files /var/www/html/web/sites/multisite-a.local/files /var/www/html/web/sites/multisite-b.local/files"]


  php-a:
    build:
      context: .
      dockerfile: dockerfile
      target: app
    user: "82:82"
    container_name: drupal-php-a
    working_dir: /var/www/html
    read_only: true
    tmpfs:
      - /tmp:exec
      - /run
    volumes:
      - ./:/var/www/html:ro #bind
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
      - drupal_public_files:/var/www/html/web/sites/default/files:rw
      - drupal_multisite_a_files:/var/www/html/web/sites/multisite-a.local/files:rw
      - drupal_multisite_b_files:/var/www/html/web/sites/multisite-b.local/files:rw
    networks:
      varnish-a-net:
      cluster_a_net:
        aliases:
          - php
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 256MB
        limits:
          cpus: '1.75'
          memory: 1024M
    depends_on:
      postgres-a:
        condition: service_healthy
      redis-a:
        condition: service_healthy
      php-init-a:
        condition: service_completed_successfully
    restart: unless-stopped

  cron-a:
    build:
      context: .
      dockerfile: dockerfile
      target: cron-a
    working_dir: /var/www/html
    read_only: true
    tmpfs:
      - /tmp:exec
      - /run
    volumes:
      - ./:/var/www/html:ro
      - drupal_public_files:/var/www/html/web/sites/default/files:rw
      - drupal_multisite_a_files:/var/www/html/web/sites/multisite-a.local/files:rw
      - drupal_multisite_b_files:/var/www/html/web/sites/multisite-b.local/files:rw
    networks:
      - cluster_a_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    depends_on:
      postgres-a:
        condition: service_healthy
      redis-a:
        condition: service_healthy
      php-a:
        condition: service_started
    restart: unless-stopped


  nginx-a:
    image: nginxinc/nginx-unprivileged
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./:/var/www/html:ro # bind
      - drupal_public_files:/var/www/html/web/sites/default/files:ro
      - drupal_multisite_a_files:/var/www/html/web/sites/multisite-a.local/files:ro
      - drupal_multisite_b_files:/var/www/html/web/sites/multisite-b.local/files:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro #config
    networks:
      cluster_a_net:
        aliases:
          - nginx
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 96M
    depends_on:
      - php-a
    restart: unless-stopped

  varnish-a:
    image: varnish:fresh
    container_name: drupal_varnish_a
    volumes:
      - ./docker/varnish/default.vcl:/etc/varnish/default.vcl:ro
    networks:
      haproxy_net:
      cluster_a_net:
        aliases:
          - varnish
    command: varnishd -F -a :80,PROXY -f /etc/varnish/default.vcl -s malloc,256m # start varnish protocol met config file en laat luisteren op MAX cache van 256MB
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 256M
        limits: 
          cpus: '1.50'
          memory: 384M
    depends_on:
      - nginx-a
    restart: unless-stopped



    #CLUSTER B
  postgres-b:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drupal_test}
      POSTGRES_USER: ${POSTGRES_USER:-drupal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ./custom-postgres.conf:/etc/postgresql/postgresql.conf:ro
      - db_data_b:/var/lib/postgresql/data #bind 
      - ./docker/postgres/init-b.sql:/docker-entrypoint-initdb.d/init-b.sql:ro
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 256M
        limits:
          cpus: '1.50'
          memory: 640M
    networks:
      cluster_b_net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drupal_user} -d ${POSTGRES_DB:-drupal_test}"] #pg_isready is het door postgres geleverde commando voor checken of het ready is
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-b:
    image: redis:alpine
    container_name: drupaldocker-redis-1-b
    volumes:
      - redis_data_b:/data:rw
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      cluster_b_net:
        aliases:
          - redis
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5 
    restart: unless-stopped

  php-init-b:
    build:
      context: .
      dockerfile: dockerfile
      target: app
    container_name: drupal-init-b
    working_dir: /var/www/html
    restart: "no"
    volumes:
      - ./:/var/www/html:ro #bind
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
      - drupal_multisite_c_files:/var/www/html/web/sites/multisite-c.local/files:rw
      - drupal_multisite_d_files:/var/www/html/web/sites/multisite-d.local/files:rw
      - drupal_domain_b_files:/var/www/html/web/sites/domain-b.local/files:rw
    networks:
      - cluster_b_net
    depends_on:
      postgres-b:
        condition: service_healthy
      redis-b:
        condition: service_healthy
    command: ["sh", "-ec", "chown -R 82:82 /var/www/html/web/sites/multisite-c.local/files /var/www/html/web/sites/multisite-d.local/files /var/www/html/web/sites/domain-b.local/files"]


  php-b:
    build:
      context: .
      dockerfile: dockerfile
      target: app
    user: "82:82"
    container_name: drupal-php-b
    working_dir: /var/www/html
    read_only: true
    tmpfs:
      - /tmp:exec
      - /run
    volumes:
      - ./:/var/www/html:ro #bind
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
      - drupal_multisite_c_files:/var/www/html/web/sites/multisite-c.local/files:rw
      - drupal_multisite_d_files:/var/www/html/web/sites/multisite-d.local/files:rw
      - drupal_domain_b_files:/var/www/html/web/sites/domain-b.local/files:rw
    networks:
      haproxy_net:
      cluster_b_net:
        aliases:
          - php
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 256M
        limits:
          cpus: '1.75'
          memory: 1024M
    depends_on:
      postgres-b:
        condition: service_healthy
      redis-b:
        condition: service_healthy
      php-init-b:
        condition: service_completed_successfully
    restart: unless-stopped

  cron-b:
    build:
      context: .
      dockerfile: dockerfile
      target: cron-b
    working_dir: /var/www/html
    read_only: true
    tmpfs:
      - /tmp:exec
      - /run
    volumes:
      - ./:/var/www/html:ro
      - drupal_multisite_c_files:/var/www/html/web/sites/multisite-c.local/files:rw
      - drupal_multisite_d_files:/var/www/html/web/sites/multisite-d.local/files:rw
      - drupal_domain_b_files:/var/www/html/web/sites/domain-b.local/files:rw
    networks:
      - cluster_b_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      postgres-b:
        condition: service_healthy
      redis-b:
        condition: service_healthy
      php-b:
        condition: service_started
    restart: unless-stopped


  nginx-b:
    image: nginxinc/nginx-unprivileged
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./:/var/www/html:ro # bind
      - drupal_multisite_c_files:/var/www/html/web/sites/multisite-c.local/files:ro
      - drupal_multisite_d_files:/var/www/html/web/sites/multisite-d.local/files:ro
      - drupal_domain_b_files:/var/www/html/web/sites/domain-b.local/files:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro #config
    networks:
      cluster_b_net:
        aliases:
          - nginx
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 96M
    depends_on:
      - php-b
    restart: unless-stopped

  varnish-b:
    image: varnish:fresh
    container_name: drupal_varnish_b
    volumes:
      - ./docker/varnish/default.vcl:/etc/varnish/default.vcl:ro
    networks:
      haproxy_net:
      cluster_b_net:
        aliases:
          - varnish 
    command: varnishd -F -a :80,PROXY -f /etc/varnish/default.vcl -s malloc,256m # start varnish protocol met config file en laat luisteren op 
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 256M
        limits: 
          cpus: '1.50'
          memory: 384M
    depends_on:
      - nginx-b
    restart: unless-stopped

networks:
  cluster_a_net:
    driver: bridge
  cluster_b_net:
    driver: bridge
  haproxy_net:
    driver: bridge
  varnish-a-net:
    driver: bridge
  varnish-b-net:
    driver: bridge
  

volumes:
  db_data_a:
  db_data_b:
  redis_data_a:
  redis_data_b:
  drupal_public_files:
  drupal_multisite_a_files:
  drupal_multisite_b_files:
  drupal_multisite_c_files:
  drupal_multisite_d_files:
  drupal_domain_b_files:
  solr_data:
  
