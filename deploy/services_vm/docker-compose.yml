services:
      

  solr_init:
    image: busybox:latest
    container_name: central_solr_init
    user: root
    volumes:
      - solr_data:/var/solr/data:rw
    command: chown -R 8983:8983 /var/solr/data

  solr:
    image: solr:9.10.1
    container_name: central_solr
    restart: unless-stopped
    depends_on:
      solr_init:
        condition: service_completed_successfully
    volumes:
      - solr_data:/var/solr/data:rw
      - ./solr-ssl.keystore.p12:/var/solr/solr-ssl.keystore.p12:ro
      - ./conf_a:/var/solr/data/drupal_cluster_a/conf:rw
      - ./conf_b:/var/solr/data/drupal_cluster_b/conf:rw
      - ./conf_c:/var/solr/data/drupal_cluster_c/conf:rw
      - ./conf_d:/var/solr/data/drupal_cluster_d/conf:rw
    ports:
      - "8983:8983"
    environment:
      SOLR_SSL_ENABLED: "true"
      SOLR_MODULES: "analysis-extras"
      SOLR_OPTS: "-Dsolr.jetty.ssl.sniHostCheck=false"
      SOLR_SSL_KEY_STORE_TYPE: "PKCS12"
      SOLR_SSL_TRUST_STORE_TYPE: "PKCS12"
      SOLR_SSL_KEY_STORE: "/var/solr/solr-ssl.keystore.p12"
      SOLR_SSL_TRUST_STORE: "/var/solr/solr-ssl.keystore.p12"
      SOLR_SSL_KEY_STORE_PASSWORD: "${SOLR_SSL_PASSWORD}"
      SOLR_SSL_TRUST_STORE_PASSWORD: "${SOLR_SSL_PASSWORD}"
      SOLR_SSL_NEED_CLIENT_AUTH: "false"
      SOLR_SSL_WANT_CLIENT_AUTH: "false"
      SOLR_SSL_CHECK_PEER_NAME: "false"
    networks:
      - cluster_a_net
      - cluster_b_net
    deploy:
      resources:
        reservations:
          cpus: '0.25'
          memory: 512M
        limits:
          cpus: '1.5'
          memory: 1024M
    entrypoint:
      - bash
      - "-c"
      - "solr-precreate drupal_cluster_a; solr-precreate drupal_cluster_b; exec solr -f"


  #CLUSTER A
  postgres-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drupal_test}
      POSTGRES_USER: ${POSTGRES_USER:-drupal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - ./custom-postgres.conf:/etc/postgresql/postgresql.conf:ro
      - db_data_a:/var/lib/postgresql/data #bind 
      - ./docker/postgres/init-a.sql:/docker-entrypoint-initdb.d/init-a.sql:ro
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 256M
        limits:
          cpus: '1.50'
          memory: 640M
    networks:
      cluster_a_net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drupal_user} -d ${POSTGRES_DB:-drupal_test}"] #pg_isready is het door postgres geleverde commando voor checken of het ready is
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-a:
    image: redis:alpine
    container_name: drupaldocker-redis-1-a
    volumes:
      - redis_data_a:/data:rw
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      cluster_a_net:
        aliases:
          - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5 
    restart: unless-stopped

    #CLUSTER B
  postgres-b:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drupal_test}
      POSTGRES_USER: ${POSTGRES_USER:-drupal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - ./custom-postgres.conf:/etc/postgresql/postgresql.conf:ro
      - db_data_b:/var/lib/postgresql/data #bind 
      - ./docker/postgres/init-b.sql:/docker-entrypoint-initdb.d/init-b.sql:ro
    deploy:
      resources:
        reservations:
          cpus: '0.10'
          memory: 256M
        limits:
          cpus: '1.50'
          memory: 640M
    networks:
      cluster_b_net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drupal_user} -d ${POSTGRES_DB:-drupal_test}"] #pg_isready is het door postgres geleverde commando voor checken of het ready is
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-b:
    image: redis:alpine
    container_name: drupaldocker-redis-1-b
    volumes:
      - redis_data_b:/data:rw
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6380:6379"
    networks:
      cluster_b_net:
        aliases:
          - redis
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5 
    restart: unless-stopped



networks:
  cluster_a_net:
    driver: bridge
  cluster_b_net:
    driver: bridge
  haproxy_net:
    driver: bridge
  

volumes:
  db_data_a:
  db_data_b:
  redis_data_a:
  redis_data_b:
  solr_data:
  
